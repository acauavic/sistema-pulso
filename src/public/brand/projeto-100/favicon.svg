<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Projeto 100">
  <!-- Marca do Projeto 100: 1 + ∞ = 100 (docs/manual-de-marca-projeto-100.md). Gradiente Azul 100 → Violeta → Rosa 100. -->
  <defs>
    <linearGradient id="p100" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3158FF"/>
      <stop offset=".55" stop-color="#9A55EA"/>
      <stop offset="1" stop-color="#FF4E9B"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0E0F1A"/>
  <rect x="12" y="21" width="5" height="22" rx="2.5" fill="url(#p100)"/>
  <g fill="none" stroke="url(#p100)" stroke-width="4" stroke-linecap="round">
    <circle cx="31" cy="32" r="7"/>
    <circle cx="46" cy="32" r="7"/>
  </g>
</svg>
